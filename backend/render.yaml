services:
  - type: web
    name: tradeflow-backend
    env: python
    region: ohio # Aap apne hisab se region rakh sakte hain
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true